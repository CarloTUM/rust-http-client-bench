name: bench

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Mondays 04:17 UTC: refresh the CI result row in the README
    - cron: "17 4 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # the system libcurl and OpenSSL for the clients that link them dynamically
  APT_DEPS: build-essential cmake pkg-config libssl-dev libcurl4-openssl-dev

jobs:
  smoke:
    # every push and PR: every client builds and the whole pipeline runs once,
    # with few repetitions; nothing is committed
    name: Build all clients and run a short measurement
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get install -y --no-install-recommends $APT_DEPS
      - run: python3 -I bench.py --runs 3 --inproc 20 --workspace extra/curlite-matrix --label smoke --out /tmp/smoke
      - run: python3 -I report.py /tmp/smoke/smoke.json --docs /tmp/smoke/docs --readme /tmp/smoke/none.md
      - uses: actions/upload-artifact@v4
        with:
          name: smoke
          path: /tmp/smoke

  measure:
    # weekly or by hand: the full measurement on a GitHub runner, committed
    # to results/ci-ubuntu-x86_64.json with its charts and README block
    name: Weekly measurement on the runner
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get install -y --no-install-recommends $APT_DEPS
      # dependencies are downloaded once here so that --build-time measures
      # compiling, not the network
      - run: cargo fetch
      - run: >
          python3 -I bench.py --runs 20 --https https://example.com/ --build-time
          --workspace extra/curlite-matrix --label ci-ubuntu-x86_64
      - run: python3 -I report.py results/ci-ubuntu-x86_64.json
      - name: Commit the result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/ci-ubuntu-x86_64.json docs README.md
          git diff --cached --quiet || git commit -m "CI: measurement of $(date -u +%Y-%m-%d) on ubuntu-latest"
          git push
