[package]
name = "fetch-hyper"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
# hyper directly, with what a hand-rolled client needs
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
hyper-rustls = "0.27"
http-body-util = "0.1"
tokio = { version = "1", features = ["rt", "macros"] }
